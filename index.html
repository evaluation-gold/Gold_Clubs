<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת רישום קורסים - גולדווטר אילת</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Assistant', sans-serif; background-color: #f0f4f8; color: #1e293b; margin: 0; }
        .page-wrapper { background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%); min-height: 100vh; }
        .main-container { max-width: 850px; margin: 0 auto; padding: 40px 20px; }
        .official-card { background: #ffffff; border: 1px solid #cbd5e1; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); border-radius: 4px; }
        .blue-accent-bar { height: 6px; background: linear-gradient(to left, #1e3a8a, #3b82f6); border-radius: 4px 4px 0 0; }
        .input-label { display: block; font-size: 0.85rem; font-weight: 700; color: #334155; margin-bottom: 6px; }
        .form-select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 4px; background-color: #f8fafc; font-size: 0.95rem; }
        .club-grid-item { border: 1px solid #e2e8f0; padding: 16px; border-radius: 4px; cursor: pointer; transition: all 0.2s; }
        .club-grid-item.selected { border-color: #1e3a8a; background-color: #ebf2ff; border-width: 2px; }
        .club-grid-item.full { background-color: #f1f5f9; cursor: not-allowed; opacity: 0.7; }
        .btn-submit { background-color: #1e3a8a; color: white; padding: 18px; border-radius: 4px; font-weight: 700; width: 100%; }
        .step-indicator { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; color: #1e3a8a; font-weight: 800; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); padding: 20px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const GOOGLE_SHEET_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-qQWgyIEmfWmP8_COXJl5EZh5J8e76gbDASn-3QTNhhTjxHcKiTnS2sGp1ig2t-Xh/exec";

        const CLUBS_CONFIG = [
            { name: "ספורט ימי", limit: 55 },
            { name: "טניס שולחן", limit: 21 },
            { name: "התעמלות קרקע", limit: 21 },
            { name: "בישול קולינרי", limit: 21 },
            { name: "נפלאות הקנבה", limit: 21 },
            { name: "השרדות", limit: 21 },
            { name: "תאטרון/קולנוע", limit: 25 }
        ];

        const STUDENTS_BY_CLASS = {

            "ז'4": ["אוהד עמר", "אוראל דהן", "אורי כהן", "אורי שושן", "איתי מור יוסף", "אלעד ממן", "אליה אוחנה", "אריאל זגורי", "גרזדק גרמה", "דוד כהן", "דניאל פחימה", "דניאל קדוש", "דרעי לינוי", "הלל ביטון", "זגדון שלו שלום", "חיט אלחי חיים", "טוהר אילוז", "טוהר ממן", "יהלי פרץ", "כהן מיכאל", "ליאם אזולאי", "ליהיא חזיזה", "לירוי אוחיון", "לוי ליאור", "מאור בן חמו", "מיאל חלפון", "מסרי גמליאל תהל", "נהוראי מויאל", "נועם אדרי", "נועם בן חמו", "נועם כהן", "נועם מלכה", "נועם סבג", "סויסה רואי", "סולומון רונן", "עילאי גואטה", "עילאי סרוסי", "עמית כהן", "עטיה אלין נויה", "עמרם יאן", "רונה אדרי", "רועי חזן", "רפאל אבוטבול", "רגב אורי עדינו", "שביט אדרי", "שי סויסה", "שליו מור יוסף", "תהל אוחיון", "תבל עילאי", "תדלה אלמוג"],
            "ז'5": ["אבישג שושן", "אבוטבול דניאל דויד", "אדל אוחיון", "אדל גואטה", "אדל מלול", "אוהב איפרגן", "אוחנה אליאב מאור", "אולייניק ויקטוריה", "אוריין אדרי", "אוריין סבג", "איילה טובול", "איתי משי", "איתן דדון", "אליה חזן", "אלמוג אדרי", "אלעאי בן חמו", "אריאל עמר", "בוגנים חן חנניה", "בן גיגי ענהאל", "בן שבת אביה", "ברגר אלין", "ברגר ליאן", "גריג גבריאל", "דויטאשוילי בן", "הדר בן חמו", "זנו נועם", "טוהר פרץ", "יאיר אדרי", "יהלי מויאל", "יונתן בן שימול", "ינובסקי איתמר", "לגס סלמא", "ליאם ביטון", "ליאן ממן", "ליאל מלכה", "לרואינה קולי בנחאמין", "מאור ועקנין", "מאור מלכה", "מועלם יהב אסף", "נהוראי אוחנה", "נהוראי דהן", "נוי דהן", "נועה בן שימול", "עילי אילוז", "עמית ממן", "רומי זגורי", "שון חזיזה", "שחר כהן", "שילה כהן", "תהילה זריהן"],
            "ז'8": ["אביב אדרי", "אביגיל סבג", "אדל סבג", "אורין קקון", "איתי גואטה", "איתי מויאל", "אליה אלוש", "אליה ועקנין", "אלעאי אילוז", "אריאל איפרגן", "אריאל ביטון", "אריאל מור יוסף", "דניאל אילוז", "דניאל חלפון", "הדר בן שימול", "טוהר דדון", "יהונתן שוקרון", "ירין אבוטבול", "ליאור מלכה", "ליאל אוחיון", "ליאם אוחיון", "ליהיא אדרי", "לירז שושן", "מאור סויסה", "מיאל זריהן", "נהוראי שושן", "נועם אדרי", "נועם אילוז", "נועם שושן", "עילאי בן חמו", "עילי מלכה", "עמית זגורי", "עמית מלכה", "רועי ועקנין", "ריף ביטון", "רפאל mמן", "תהל חזיזה"],
            "ז'9": ["אביאל חזיזה", "אביתר אדרי", "אדל אילוז", "אדל מור יוסף", "אורי מלכה", "אורין בן חמו", "אורין ממן", "אוראל אלוש", "איתן ביטון", "איתן ועקנין", "איתן מלכה", "אליה אדרי", "אליה פרץ", "אלין אוחיון", "אלמוג גואטה", "אריאל אוחיון", "אריאל סבג", "הלל מלכה", "טוהר אילוז", "טוהר ביטון", "יהלי דדון", "יוסף חיים חזן", "ליאל דהן", "ליה אברג'ל", "לירוי ועקנין", "לירן ממן", "מאור אוחנה", "נהוראי גואטה", "נויה דהן", "נועם חלפון", "עומר כהן", "עילי אדרי", "עמית כהן", "רון חזיזה", "שקד בן חמו", "תהל אדרי", "תהל מויאל"],
            "ז'10": ["אביאל מלכה", "אבו רמילה גנה", "אדל ביטון", "אדיר ממן", "אוחיון יהונתן", "אחינועם בר", "אלמוג אלין", "אלעד מויאל", "אליה דדון", "אלין חלפון", "אנדמריאם מאיקס", "אורי זריהן", "אוריאל סבג", "איתמר אדרי", "ארסלן אושר", "גרינשטיין אביטל יבגניה", "דהן רון", "הלל אוחיון", "ודובץ מישל", "יהלי כהן", "יונתן חזן", "יוסף ינאי אליהו", "כהן גל", "כהן דניאל אור", "ליאם אוחנה", "ליאל אילוז", "לוי אדל", "ליאליוק ורוניקה", "ליסיצ`קין אמיליה", "לירן מרציאנו", "מאור ועקנין", "מזרתי נהוראי", "נהוראי סוויסה", "נועם אלוש", "סטגאי אזי", "סטגאי אמונאל", "עומר כהן", "עמית מלכה", "פדורנקו דמיטרי", "פרוך מגד", "פריסה סיטרין ויטוריה", "קיטשן יואאל", "קרויטורו תהילה", "רפאל דהן", "שילה חזיזה", "שופ לאה", "תהילה ועקנין"]
        };

        function App() {
            const [loading, setLoading] = useState(true);
            const [showIntro, setShowIntro] = useState(true);
            const [registeredData, setRegisteredData] = useState([]);
            const [clubStats, setClubStats] = useState({});
            const [submitting, setSubmitting] = useState(false);
            const [success, setSuccess] = useState(false);
            const [error, setError] = useState("");
            const [form, setForm] = useState({ className: "", studentName: "", choice1: "", choice2: "" });

            const fetchData = async () => {
                try {
                    setLoading(true);
                    const res = await fetch(GOOGLE_SHEET_SCRIPT_URL);
                    const data = await res.json();
                    setRegisteredData(data);
                    const stats = {};
                    CLUBS_CONFIG.forEach(c => stats[c.name] = 0);
                    data.forEach(entry => { if (entry.choice1 && stats[entry.choice1] !== undefined) stats[entry.choice1]++; });
                    setClubStats(stats);
                } catch (err) { console.error("Fetch error:", err); } 
                finally { setLoading(false); }
            };

            useEffect(() => { fetchData(); }, []);

            const getClubStatus = (clubName) => {
                const config = CLUBS_CONFIG.find(c => c.name === clubName);
                const count = clubStats[clubName] || 0;
                return { count, limit: config.limit, isFull: count >= config.limit };
            };

            const submitForm = async () => {
                const status1 = getClubStatus(form.choice1);
                if (status1.isFull) { setError(`חוג ${form.choice1} התמלא.`); fetchData(); return; }
                setSubmitting(true);
                try {
                    await fetch(GOOGLE_SHEET_SCRIPT_URL, {
                        method: "POST", mode: "no-cors",
                        body: JSON.stringify({ ...form, timestamp: new Date().toLocaleString('he-IL') }),
                    });
                    setSuccess(true);
                } catch (err) { setError("שגיאת תקשורת."); } 
                finally { setSubmitting(false); }
            };

            if (loading) return <div className="flex h-screen items-center justify-center bg-white">טוען...</div>;

            if (success) return (
                <div className="page-wrapper flex items-center justify-center p-6" dir="rtl">
                    <div className="official-card p-10 max-w-lg w-full text-center">
                        <h1 className="text-2xl font-black mb-4">הרישום בוצע בהצלחה!</h1>
                        <p>נרשמת בהצלחה בתור {form.studentName}.</p>
                        <button onClick={() => window.location.reload()} className="mt-4 text-blue-800 font-bold underline">רישום נוסף</button>
                    </div>
                </div>
            );

            return (
                <div className="page-wrapper text-right" dir="rtl">
                    {showIntro && (
                        <div className="modal-overlay">
                            <div className="official-card max-w-md w-full p-8">
                                <h2 className="text-xl font-black mb-4">ברוכים הבאים</h2>
                                <p>אנא בחרו את חוג ההעשרה למחצית ב'.</p>
                                <button onClick={() => setShowIntro(false)} className="mt-8 w-full py-4 bg-blue-900 text-white font-bold rounded">הבנתי, למעבר לרישום</button>
                            </div>
                        </div>
                    )}

                    <div className="main-container">
                        <header className="mb-8 text-center">
                            <h1 className="text-3xl font-black text-blue-900">גולדווטר אילת</h1>
                        </header>

                        <div className="space-y-6">
                            <div className="official-card p-8">
                                <div className="step-indicator"><span>1.</span><span>זיהוי תלמיד/ה</span></div>
                                <div className="grid md:grid-cols-2 gap-6">
                                    <div>
                                        <label className="input-label">כיתה</label>
                                        <select 
                                            className="form-select"
                                            value={form.className}
                                            onChange={(e) => setForm({className: e.target.value, studentName: "", choice1: "", choice2: ""})}
                                        >
                                            <option value="">בחר/י כיתה...</option>
                                            {Object.keys(STUDENTS_BY_CLASS).map(c => <option key={c} value={c}>{c}</option>)}
                                        </select>
                                    </div>
                                    {form.className && (
                                        <div>
                                            <label className="input-label">שם התלמיד/ה</label>
                                            <select 
                                                className="form-select"
                                                value={form.studentName}
                                                onChange={(e) => setForm({...form, studentName: e.target.value})}
                                            >
                                                <option value="">בחר/י שם...</option>
                                                {STUDENTS_BY_CLASS[form.className].map(name => (
                                                    <option key={name} value={name}>{name}</option>
                                                ))}
                                            </select>
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className={`official-card p-8 ${!form.studentName ? 'opacity-40 pointer-events-none' : ''}`}>
                                <div className="step-indicator"><span>2.</span><span>עדיפות ראשונה</span></div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    {CLUBS_CONFIG.map(club => {
                                        const status = getClubStatus(club.name);
                                        return (
                                            <div key={club.name} onClick={() => !status.isFull && setForm({...form, choice1: club.name, choice2: ""})}
                                                className={`club-grid-item ${form.choice1 === club.name ? 'selected' : ''} ${status.isFull ? 'full' : ''}`}>
                                                <span className="font-bold">{club.name}</span>
                                                <div className="text-[11px]">{status.isFull ? 'מלא' : `נותרו ${status.limit - status.count}`}</div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className={`official-card p-8 ${!form.choice1 ? 'opacity-40 pointer-events-none' : ''}`}>
                                <div className="step-indicator"><span>3.</span><span>עדיפות שנייה</span></div>
                                <div className="flex flex-wrap gap-2">
                                    {CLUBS_CONFIG.map(club => (
                                        <button key={club.name + "_2"} disabled={form.choice1 === club.name}
                                            onClick={() => setForm({...form, choice2: club.name})}
                                            className={`px-4 py-2 border rounded font-bold ${form.choice2 === club.name ? 'bg-blue-900 text-white' : 'bg-white'}`}>
                                            {club.name}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <button onClick={submitForm} disabled={submitting || !form.choice2} className="btn-submit">
                                {submitting ? 'שולח...' : 'שלח רישום'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
